<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orbit — Your Future, Organized</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>
  
<style>
  /* ===========================
   RESET
=========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',sans-serif;
    background:#09090B;
    color:#ffffff;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}

/* ===========================
   CONTAINER
=========================== */

.container{
    width:min(1100px,92%);
    margin:auto;
}

/* ===========================
   NAVBAR
=========================== */

.navbar{
    padding:30px 0;
}

.logo{
    font-size:2rem;
    font-weight:800;
    letter-spacing:-1px;
}

/* ===========================
   HERO
=========================== */

.hero{
    padding:80px 0 60px;
    text-align:center;
}

.badge{
    display:inline-block;
    padding:10px 18px;
    border-radius:999px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    color:#93C5FD;
    font-size:.9rem;
    margin-bottom:28px;
}

.hero h1{
    font-size:clamp(3rem,8vw,5rem);
    line-height:1;
    letter-spacing:-3px;
    margin-bottom:25px;
}

.hero p{
    max-width:680px;
    margin:auto;
    color:#9CA3AF;
    font-size:1.15rem;
    line-height:1.8;
}

/* ===========================
   WAITLIST
=========================== */

.waitlist{
    padding:40px 0 90px;
}

#waitlistForm{
    max-width:760px;
    margin:auto;
}

/* ===========================
   CARD
=========================== */

.card{
    background:#111114;
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:32px;
    margin-bottom:24px;
}

.card h2{
    font-size:1.4rem;
    margin-bottom:25px;
}

/* ===========================
   INPUTS
=========================== */

input{
    width:100%;
    height:58px;
    margin-bottom:16px;
    border:none;
    outline:none;
    border-radius:16px;
    background:#18181B;
    border:1px solid rgba(255,255,255,.06);
    color:white;
    padding:0 18px;
    font-size:1rem;
    transition:.25s;
}

input:focus{
    border-color:#2563EB;
}

/* ===========================
   ROLE GRID
=========================== */

.role-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.role-btn{
    height:64px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    background:#18181B;
    color:white;
    font-size:1rem;
    font-weight:600;
    border:1px solid rgba(255,255,255,.06);
    transition:.25s;
}

.role-btn:hover{
    border-color:#2563EB;
    transform:translateY(-2px);
}

.role-btn.active{
    background:#2563EB;
    border-color:#2563EB;
}

/* ===========================
   BUTTON
=========================== */

.join-btn{
    width:100%;
    height:64px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    background:#2563EB;
    color:white;
    font-size:1.05rem;
    font-weight:700;
    transition:.25s;
}

.join-btn:hover{
    background:#1D4ED8;
    transform:translateY(-2px);
}

/* ===========================
   FOOTER
=========================== */

footer{
    padding:40px 0;
    border-top:1px solid rgba(255,255,255,.08);
    text-align:center;
    color:#6B7280;
}

/* ===========================
   MOBILE
=========================== */

@media(max-width:768px){

.hero{
    padding:60px 0 40px;
}

.hero h1{
    letter-spacing:-2px;
}

.role-grid{
    grid-template-columns:1fr;
}

.card{
    padding:24px;
}

}
  
</style>

<body>

<header class="navbar">

<div class="container">

<div class="logo">
orbit
</div>

</div>

</header>

<main>

<section class="hero">

<div class="container">

<div class="badge">
Early Access
</div>

<h1>

Your Future.<br>
Organized.

</h1>

<p>

One intelligent workspace for students and young professionals.
Plan your future, discover opportunities, and stay organized in one place.

</p>

</div>

</section>

<section class="waitlist">

<div class="container">

<form id="waitlistForm"
action="xaqzjzgz"
method="POST">

<div class="card">

<h2>About You</h2>

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

</div>

<div class="card">

<h2>Choose Your Role</h2>

<div class="role-grid">

<button
type="button"
class="role-btn active"
data-role="Student">

🎓 Student

</button>

<button
type="button"
class="role-btn"
data-role="College Student">

📚 College Student

</button>

<button
type="button"
class="role-btn"
data-role="Working Professional">

💼 Working Professional

</button>

<button
type="button"
class="role-btn"
data-role="Other">

✨ Other

</button>

</div>

<input
type="hidden"
name="role"
id="roleInput"
value="Student">

</div>

<button
class="join-btn"
type="submit">

Join the Waitlist

</button>

</form>

</div>

</section>

<footer>

<div class="container">

<p>

Orbit © 2026

</p>

</div>

</footer>

</main>

<script>
  // ===============================
// ROLE SELECTOR
// ===============================

const roleButtons = document.querySelectorAll(".role-btn");
const roleInput = document.getElementById("roleInput");

roleButtons.forEach(button => {

    button.addEventListener("click", () => {

        roleButtons.forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        roleInput.value = button.dataset.role;

    });

});

// ===============================
// FORM SUBMISSION
// ===============================

const form = document.getElementById("waitlistForm");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const response = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: {
            "Accept": "application/json"
        }
    });

    if (response.ok) {

        window.location.href = "thankyou.html";

    } else {

        alert("Something went wrong. Please try again.");

    }

});
</script>

</body>

</html>
