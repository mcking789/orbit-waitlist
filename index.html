<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orbit — Your Future, Organized</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

<div class="container">

<div class="logo">
orbit
</div>

</div>

</header>

<main>

<section class="hero">

<div class="container">

<div class="badge">
Early Access
</div>

<h1>

Your Future.<br>
Organized.

</h1>

<p>

One intelligent workspace for students and young professionals.
Plan your future, discover opportunities, and stay organized in one place.

</p>

</div>

</section>

<section class="waitlist">

<div class="container">

<form id="waitlistForm"
action="xaqzjzgz"
method="POST">

<div class="card">

<h2>About You</h2>

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

</div>

<div class="card">

<h2>Choose Your Role</h2>

<div class="role-grid">

<button
type="button"
class="role-btn active"
data-role="Student">

🎓 Student

</button>

<button
type="button"
class="role-btn"
data-role="College Student">

📚 College Student

</button>

<button
type="button"
class="role-btn"
data-role="Working Professional">

💼 Working Professional

</button>

<button
type="button"
class="role-btn"
data-role="Other">

✨ Other

</button>

</div>

<input
type="hidden"
name="role"
id="roleInput"
value="Student">

</div>

<button
class="join-btn"
type="submit">

Join the Waitlist

</button>

</form>

</div>

</section>

<footer>

<div class="container">

<p>

Orbit © 2026

</p>

</div>

</footer>

</main>

<script src="script.js"></script>

</body>

</html>
