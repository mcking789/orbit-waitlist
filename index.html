<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orbit — Your Future, Organized</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>
  
  <style>
   .space-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-100;
pointer-events:none;
}

/* BLOBS */

.blob{
position:absolute;
border-radius:50%;
filter: blur(220px);
opacity: .12;
animation:float 18s ease-in-out infinite;
}

.blob1{
width:600px;
height:600px;
background:#1d4ed8;
top:-180px;
left:-150px;
}

.blob2{
width:700px;
height:700px;
background:#3730a3;
right:-220px;
top:25%;
animation-delay:-6s;
}

.blob3{
width:650px;
height:650px;
background:#0891b2;
left:35%;
bottom:-220px;
animation-delay:-12s;
}

/* RINGS */

.ring{
position:absolute;
border:1px solid rgba(255,255,255,.08);
border-radius:50%;
animation:rotateRing 45s linear infinite;
}

.ring1{
width:900px;
height:900px;
top:-250px;
left:-250px;
}

.ring2{
width:700px;
height:700px;
bottom:-220px;
right:-180px;
animation-direction:reverse;
}

/* STARS */

.stars{
position:absolute;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px, transparent 1px),
radial-gradient(#7dcfff 1px, transparent 1px),
radial-gradient(#4ea8ff 1px, transparent 1px);

background-size:
220px 220px,
170px 170px,
280px 280px;

opacity:.22;

animation:starsMove 90s linear infinite;
}

/* FLOAT */

@keyframes float{

0%{
transform:translate(0,0) scale(1);
}

25%{
transform:translate(80px,-60px) scale(1.05);
}

50%{
transform:translate(-60px,90px) scale(.95);
}

75%{
transform:translate(60px,40px) scale(1.04);
}

100%{
transform:translate(0,0) scale(1);
}

}

/* ROTATE */

@keyframes rotateRing{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

/* STARS */

@keyframes starsMove{

from{
transform:translateY(0);
}

to{
transform:translateY(-180px);
}

.glass{

background:rgba(255,255,255,.06);

backdrop-filter:blur(22px);

border:1px solid rgba(255,255,255,.08);

border-radius:28px;

box-shadow:
0 0 40px rgba(0,140,255,.08);

}
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}
      </style>

<body>

<header class="navbar">

<div class="container">

<div class="logo">
orbit
</div>

</div>

</header>

<main>

<section class="hero">

<div class="container">

<div class="badge">
Early Access
</div>

<h1>

Your Future.<br>
Organized.

</h1>

<p>

One intelligent workspace for students and young professionals.
Plan your future, discover opportunities, and stay organized in one place.

</p>

</div>

</section>

<section class="waitlist">

<div class="container">

<form id="waitlistForm"
action="xaqzjzgz"
method="POST">

<div class="card">

<h2>About You</h2>

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

</div>

<div class="card">

<h2>Choose Your Role</h2>

<div class="role-grid">

<button
type="button"
class="role-btn active"
data-role="Student">

🎓 Student

</button>

<button
type="button"
class="role-btn"
data-role="College Student">

📚 College Student

</button>

<button
type="button"
class="role-btn"
data-role="Working Professional">

💼 Working Professional

</button>

<button
type="button"
class="role-btn"
data-role="Other">

✨ Other

</button>

</div>

<input
type="hidden"
name="role"
id="roleInput"
value="Student">

</div>

<button
class="join-btn"
type="submit">

Join the Waitlist

</button>

</form>

</div>

</section>

<footer>

<div class="container">

<p>

Orbit © 2026

</p>

</div>

</footer>

</main>

<script src="script.js"></script>

</body>

</html>
